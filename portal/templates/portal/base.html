{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Campus Portal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'portal/css/style.css' %}">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
        <div class="header-container">
            <div class="brand">
                <img src="{% static 'portal/images/logo.png' %}" 
                     alt="College Department Student Portal Emblem" 
                     width="64" 
                     height="64">
                <span class="brand-name">CCS Student Portal</span>
            </div>
            {% include 'portal/partials/navbar.html' %}
        </div>
    </header>

    <main id="main-content" class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 College Department Student Portal | Python Programming 2</p>
    </footer>
</body>
</html>
